services:
  web:
    build: .
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-portfoliohub}
      DB_USER: ${MYSQL_USER:-portfoliohub_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-portfoliohub_password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfoliohub}
      MYSQL_USER: ${MYSQL_USER:-portfoliohub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfoliohub_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/portfoliohub.sql:/docker-entrypoint-initdb.d/01-portfoliohub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
