# =============================================================================
# Alias aset statis untuk PortfolioHub.
#
# DocumentRoot diarahkan ke /var/www/html/public, sedangkan folder assets/
# (CSS, JS, gambar, dan upload media) berada di /var/www/html/assets.
# Alias ini menyajikan URL /assets/... dari lokasi tersebut.
# =============================================================================

Alias /assets /var/www/html/assets

<Directory /var/www/html/assets>
    Require all granted
    Options -Indexes
</Directory>
